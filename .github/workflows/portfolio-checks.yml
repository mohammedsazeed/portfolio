name: Portfolio checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Legacy components are no longer mounted by the redesigned app, but retain
      # existing lint errors. Validate the new entry point until cleanup is scoped.
      - run: npx eslint src/App.jsx
      - run: npm run build
